name: 🧮 Generate GitHub Profile Metrics

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  base-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 📊 Generate Main Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: Advik-B
          template: classic
          config_timezone: Asia/Kolkata
          
          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          plugin_traffic: yes

  stars-habits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: ⭐ Generate Stars + Habits Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: Advik-B
          filename: metrics.plugin.stars.svg
          base: ""
          config_timezone: Asia/Kolkata

          plugin_followers: yes

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_repositories: yes

  pinned-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 📌 Generate Pinned Projects
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: Advik-B
          filename: metrics.plugin.repositories.svg
          base: ""
          config_timezone: Asia/Kolkata

          plugin_repositories: yes
          plugin_repositories_pinned: 6
